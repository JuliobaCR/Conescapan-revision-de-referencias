[project]
name = "refcheck"
version = "0.1.0"
description = "Verificación de referencias para la fase 1 de revisión de manuscritos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
refcheck = "refcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["refcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests que salen a la red están marcados; por defecto no corren.
markers = ["network: requiere acceso a las APIs bibliográficas"]
addopts = "-m 'not network'"
