name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check refcheck tests
      - name: Tests
        # Los tests marcados con @pytest.mark.network quedan fuera:
        # el CI no debe depender de la disponibilidad de Crossref o DBLP.
        run: pytest -q
